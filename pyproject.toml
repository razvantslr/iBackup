[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibackup"
version = "0.1.0"
description = "Backup de poze de pe iPhone si din foldere vechi, sortate pe an/luna/locatie"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
iphone-afc = ["pymobiledevice3>=4.0"]
iphone-mtp = ["pywin32>=306"]

[project.scripts]
ibackup = "ibackup.cli:main"

[tool.setuptools.packages.find]
include = ["ibackup*"]
